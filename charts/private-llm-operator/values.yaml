PUBLIC_HOST: localhost
PUBLIC_SCHEME: http
tls:
  secretName: ''
ocm:
  enabled: true
auth:
  externalURL: ''
# Required fixed cutover and reviewed MSP instance identities. Never use template now.
# See docs/slug-policy.md before upgrading an existing installation.
slugPolicy:
  cutover: ''
  entries: []
image:
  repository: ghcr.io/apeirora/private-llm-controller
  tag: 2.17.1-rc.2
  pullPolicy: IfNotPresent
imagePullSecrets: []
extraEnv: []
traefik:
  enabled: true
  ingressClass:
    enabled: true
    isDefaultClass: false
    name: traefik
  service:
    type: LoadBalancer
ingress:
  className: ''
  extraAnnotations: {}
  ports:
    web:
      nodePort: 30080
    websecure:
      nodePort: 30443
portalIntegration:
  enabled: false
  contentVariant: default
  contentPath: /pm-content.json
  secretResourceDefinition:
    group: v1
    version: ''
    plural: Secrets
    kind: Secret
  image:
    repository: nginx
    tag: '1.25'
    pullPolicy: IfNotPresent
  resources: {}
  ingress:
    annotations: {}
branding:
  sidebar:
    title: LLM by MODEL Corp
modelServerCeilings:
  cpuMilli: 0
  memoryMiB: 0
  contextSize: 0
  parallelSlots: 0
byocTLS:
  domain: ''
  namespace: private-llm-byoc-tls
  issuerName: traefik-cert-issuer
  issuerNamespace: kube-system
  dnsClass: garden
