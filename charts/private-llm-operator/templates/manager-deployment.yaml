apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-llm-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "private-llm-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        checksum/slug-policy: {{ include (print $.Template.BasePath "/slug-policy.yaml") . | sha256sum }}
      labels:
        {{- include "private-llm-operator.labels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
        - args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --leader-elect
            - --auth-bind-address=:8090
            - --auth-external-url=$(AUTH_EXTERNAL_URL)
            - --slug-policy-file=/etc/private-llm-slugs/policy.json
            - --max-model-cpu-milli={{ .Values.modelServerCeilings.cpuMilli }}
            - --max-model-memory-mib={{ .Values.modelServerCeilings.memoryMiB }}
            - --max-context-size={{ .Values.modelServerCeilings.contextSize }}
            - --max-parallel-slots={{ .Values.modelServerCeilings.parallelSlots }}
          command:
            - /manager
          volumeMounts:
            - name: slug-policy
              mountPath: /etc/private-llm-slugs
              readOnly: true
          env:
            - name: PUBLIC_HOST
              value: {{ coalesce (index (.Values.global | default dict) "publicHost") .Values.PUBLIC_HOST "localhost" | quote }}
            - name: PUBLIC_SCHEME
              value: {{ coalesce (index (.Values.global | default dict) "publicScheme") .Values.PUBLIC_SCHEME "http" | quote }}
            - name: TLS_SECRET_NAME
              value: {{ .Values.tls.secretName | default "" | quote }}
            - name: INGRESS_EXTRA_ANNOTATIONS
              value: {{ .Values.ingress.extraAnnotations | toJson | quote }}
            - name: BYOC_TLS_DOMAIN
              value: {{ .Values.byocTLS.domain | quote }}
            - name: BYOC_TLS_NAMESPACE
              value: {{ .Values.byocTLS.namespace | quote }}
            - name: BYOC_TLS_ISSUER
              value: {{ .Values.byocTLS.issuerName | quote }}
            - name: BYOC_TLS_ISSUER_NAMESPACE
              value: {{ .Values.byocTLS.issuerNamespace | quote }}
            - name: BYOC_DNS_CLASS
              value: {{ .Values.byocTLS.dnsClass | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AUTH_EXTERNAL_URL
              value: {{ .Values.auth.externalURL | default "" | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 8090
              name: auth
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
      serviceAccountName: private-llm-controller-manager
      volumes:
        - name: slug-policy
          configMap:
            name: private-llm-slug-policy
      terminationGracePeriodSeconds: 10
