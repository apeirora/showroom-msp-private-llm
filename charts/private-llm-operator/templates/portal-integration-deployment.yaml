{{- if .Values.portalIntegration.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal-integration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "private-llm-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: portal-integration
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/portal-integration-config: {{ include (print $.Template.BasePath "/portal-integration-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "private-llm-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal-integration
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ .Values.portalIntegration.image.repository }}:{{ .Values.portalIntegration.image.tag }}
          imagePullPolicy: {{ .Values.portalIntegration.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: portal-config
              mountPath: /usr/share/nginx/html/pm-content.json
              subPath: pm-content.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/configuration.json
              subPath: ord-configuration.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/documents/private-llm.json
              subPath: ord-private-llm.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/definitions/private-llm.oas3.json
              subPath: ord-private-llm.oas3.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ui-extensions/ord/index.html
              subPath: ord-renderer-index.html
            - name: portal-config
              mountPath: /usr/share/nginx/html/ui-extensions/ord/styles.css
              subPath: ord-renderer-styles.css
            - name: portal-config
              mountPath: /usr/share/nginx/html/ui-extensions/ord/renderer.js
              subPath: ord-renderer.js
            - name: portal-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
          resources:
            {{- toYaml .Values.portalIntegration.resources | nindent 12 }}
      volumes:
        - name: portal-config
          configMap:
            name: {{ .Release.Name }}-portal-integration-config
            items:
              - key: pm-content.json
                path: pm-content.json
              - key: ord-configuration.json
                path: ord-configuration.json
              - key: ord-private-llm.json
                path: ord-private-llm.json
              - key: ord-private-llm.oas3.json
                path: ord-private-llm.oas3.json
              - key: ord-renderer-index.html
                path: ord-renderer-index.html
              - key: ord-renderer-styles.css
                path: ord-renderer-styles.css
              - key: ord-renderer.js
                path: ord-renderer.js
              - key: nginx-default.conf
                path: nginx-default.conf
{{- end }}
