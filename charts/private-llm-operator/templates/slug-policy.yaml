apiVersion: v1
kind: ConfigMap
metadata:
  name: private-llm-slug-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "private-llm-operator.labels" . | nindent 4 }}
data:
  policy.json: |
    {{ dict "cutover" .Values.slugPolicy.cutover "entries" .Values.slugPolicy.entries | toJson }}
