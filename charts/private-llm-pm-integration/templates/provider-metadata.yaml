{{- $marketplaceTitle := .Values.branding.marketplace.title -}}
{{- $marketplaceDescription := .Values.branding.marketplace.description -}}
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ProviderMetadata
metadata:
  name: llm.privatellms.msp
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name (.Chart.Version | replace "+" "_") | trunc 63 | trimSuffix "-" | quote }}
spec:
  displayName: {{ $marketplaceTitle | quote }}
  description: |
{{ $marketplaceDescription | nindent 4 }}
  contacts:
    - displayName: Alex IT Architect
      role: ["IT Architect"]
  preferredSupportChannels:
    - displayName: ApeiroRA Help Desk
      url: https://help.privatellms.msp
  documentation:
    - displayName: ORD
      url: {{ printf "%s://%s%s" .Values.publicScheme .Values.publicHost .Values.ord.configPath | quote }}
  data:
    ord:
      configUrl: {{ printf "%s://%s%s" .Values.publicScheme .Values.publicHost .Values.ord.configPath | quote }}
  detailViewExtensions:
    - url: {{ printf "%s://%s%s?v=%s" .Values.publicScheme .Values.publicHost .Values.detailViewExtension.path .Chart.Version | quote }}
  icon:
    light:
      data: 'data:image/png;base64,{{ (.Files.Get "files/icon.png") | b64enc }}'
    dark:
      data: 'data:image/png;base64,{{ (.Files.Get "files/icon.png") | b64enc }}'
