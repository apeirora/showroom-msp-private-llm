name: Sync namespace boundaries

on:
  pull_request:
    paths: ['charts/**', 'hack/namespace-boundaries/**', '.github/workflows/sync-namespace-boundaries.yml']
  push:
    branches: [main]
    paths: ['charts/**', 'hack/namespace-boundaries/**', '.github/workflows/sync-namespace-boundaries.yml']

permissions:
  contents: read

jobs:
  native-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.4'
          cache: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.3
      - run: python3 -m pip install PyYAML==6.0.3
      - run: helm dependency build charts/private-llm-sync-agent
      - run: python3 hack/namespace-boundaries/check.py --chart charts/private-llm-sync-agent
